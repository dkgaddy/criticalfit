<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#142019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Critical Fit">
  <title>Critical Fit — Progress</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/criticalfitLogo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="js/theme.js"></script>
</head>
<body id="progress-page">

  <header class="app-header">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
    <img src="images/CriticalFit-1line-logo-small.png" alt="Critical Fit" class="header-logo">
  </header>

  <!-- ======= Hamburger Menu ======= -->
  <div class="ham-menu" id="ham-menu" hidden>
    <a href="info.html" class="ham-item">
      <i class="fa-solid fa-circle-info"></i> Info
    </a>
    <button class="ham-item" id="nav-install">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Install
    </button>
    <button class="ham-item" id="ham-settings">
      <i class="fa-solid fa-gear"></i> Settings
    </button>
  </div>

  <main class="journal-page">

    <!-- Range selector -->
    <div class="progress-range-row">
      <div class="form-select-wrap" style="max-width:220px;">
        <select class="form-select" id="progress-range">
          <option value="7" selected>Last Week</option>
          <option value="30">Last 30 Days</option>
          <option value="60">Last 60 Days</option>
          <option value="180">Last 180 Days</option>
          <option value="365">Last Year</option>
        </select>
        <i class="fa-solid fa-chevron-down form-select-icon" aria-hidden="true"></i>
      </div>
    </div>

    <!-- 1. Life Points -->
    <section class="card">
      <h3 class="card-title">Life Points</h3>
      <div class="progress-chart" id="chart-lifepoints"></div>
    </section>

    <!-- 2. Energy Stored -->
    <section class="card">
      <h3 class="card-title">Energy Stored Each Day</h3>
      <div class="progress-chart" id="chart-energy-stored"></div>
    </section>

    <!-- 3. Energy Breakdown -->
    <section class="card">
      <h3 class="card-title">Energy Breakdown</h3>
      <div class="progress-chart" id="chart-breakdown"></div>
    </section>

    <!-- 4. Total Energy Used -->
    <section class="card">
      <h3 class="card-title">Total Energy Used Each Day</h3>
      <div class="progress-chart" id="chart-energy-used"></div>
    </section>

    <!-- 5. Activity Energy -->
    <section class="card">
      <h3 class="card-title">Activity Energy Burned</h3>
      <div class="progress-chart" id="chart-activity"></div>
    </section>

    <!-- 6. Weight -->
    <section class="card">
      <h3 class="card-title">Weight</h3>
      <div class="progress-chart" id="chart-weight"></div>
    </section>

  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-scroll nav-icon" aria-hidden="true"></i>
      Journal
    </a>
    <a href="meals.html" class="nav-item" id="nav-meals">
      <i class="fa-solid fa-bowl-rice nav-icon" aria-hidden="true"></i>
      Meals
    </a>
    <a href="progress.html" class="nav-item active" aria-current="page">
      <i class="fa-solid fa-chart-line nav-icon" aria-hidden="true"></i>
      Progress
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fa-solid fa-circle-user nav-icon" aria-hidden="true"></i>
      Profile
    </a>
  </nav>

  <!-- ======= Guild Gate Popup ======= -->
  <div class="guild-gate-overlay" id="guild-gate-modal" role="dialog" aria-modal="true">
    <div class="guild-gate-sheet">
      <i class="fa-solid fa-ring guild-gate-icon"></i>
      <p class="guild-gate-msg" id="guild-gate-msg">Join the Guild for more exciting features like this!</p>
      <button class="btn btn-primary" id="guild-gate-dismiss">OK</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/energy.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/install.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
