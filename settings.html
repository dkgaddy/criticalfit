<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#142019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Critical Fit">
  <title>Critical Fit — Settings</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/CriticalFit-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="js/theme.js"></script>
</head>
<body id="settings-page">

  <!-- ======= Header ======= -->
  <header class="app-header">
    <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
    <img src="images/CriticalFit-1line-logo-small.png" alt="Critical Fit" class="header-logo">
  </header>

  <!-- ======= Hamburger Menu ======= -->
  <div class="ham-menu" id="ham-menu" hidden>
    <a href="info.html" class="ham-item">
      <i class="fa-solid fa-circle-info"></i> Info
    </a>
    <button class="ham-item" id="nav-install">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Install
    </button>
    <a href="guide.html" class="ham-item">
      <i class="fa-solid fa-book-open"></i> Guide
    </a>
    <button class="ham-item" id="ham-settings">
      <i class="fa-solid fa-gear"></i> Settings
    </button>
  </div>

  <!-- ======= Settings Page ======= -->
  <main class="journal-page">

    <div class="page-heading">
      <h2 class="page-title">Settings</h2>
      <p class="page-sub">Customize your quest experience.</p>
    </div>

    <!-- App Theme -->
    <section class="card">
      <h3 class="card-title">App Theme</h3>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="setting-theme">Theme</label>
        <div class="form-select-wrap">
          <select class="form-select" id="setting-theme">
            <option value="forest">Hunter Green</option>
            <option value="dragons-fire">Fire Red</option>
            <option value="royal-sash">Royal Blue</option>
            <option value="bog-of-carbohydrates">Bog of Carbohydrates</option>
            <option value="dungeons-and-dumbells">Dungeons and Dumbells</option>
            <option value="fatburn-forest">Fatburn Forest</option>
            <option value="lake-nightrun">Lake Nightrun</option>
            <option value="mount-protein">Mount Protein</option>
            <option value="recovery-tavern">Recovery Tavern</option>
          </select>
          <i class="fa-solid fa-chevron-down form-select-icon" aria-hidden="true"></i>
        </div>
      </div>
    </section>

    <!-- Background Music -->
    <section class="card">
      <h3 class="card-title">Background Music</h3>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label" for="setting-music">Track</label>
        <div class="form-select-wrap">
          <select class="form-select" id="setting-music">
            <option value="">None</option>
            <option value="HammeringHearts.mp3">Hammering Hearts</option>
            <option value="MistyTaverns.mp3">Misty Taverns</option>
            <option value="PipeSmoke.mp3">Pipe Smoke</option>
            <option value="RowingTheLoch.mp3">Rowing the Loch</option>
            <option value="SpinningElves.mp3">Spinning Elves</option>
          </select>
          <i class="fa-solid fa-chevron-down form-select-icon" aria-hidden="true"></i>
        </div>
      </div>
      <p class="setting-note">Plays across all screens during each session.</p>
    </section>

    <!-- Notifications -->
    <section class="card">
      <h3 class="card-title">Notifications</h3>
      <div class="setting-row">
        <span class="setting-row-label">Enable Notifications</span>
        <label class="toggle-switch">
          <input type="checkbox" id="setting-notifications" disabled>
          <span class="toggle-track"></span>
        </label>
      </div>
      <p class="setting-note">Notification features coming soon.</p>
    </section>

  </main>

  <!-- ======= Bottom Navigation ======= -->
  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a href="index.html" class="nav-item">
      <i class="fa-solid fa-scroll nav-icon" aria-hidden="true"></i>
      Journal
    </a>
    <a href="meals.html" class="nav-item" id="nav-meals">
      <i class="fa-solid fa-bowl-rice nav-icon" aria-hidden="true"></i>
      Meals
    </a>
    <a href="progress.html" class="nav-item">
      <i class="fa-solid fa-chart-line nav-icon" aria-hidden="true"></i>
      Progress
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fa-solid fa-circle-user nav-icon" aria-hidden="true"></i>
      Profile
    </a>
  </nav>

  <!-- ======= Guild Gate Popup ======= -->
  <div class="guild-gate-overlay" id="guild-gate-modal" role="dialog" aria-modal="true">
    <div class="guild-gate-sheet">
      <i class="fa-solid fa-ring guild-gate-icon"></i>
      <p class="guild-gate-msg">Join the Guild for more exciting features like this!</p>
      <button class="btn btn-primary" id="guild-gate-dismiss">OK</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/install.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
